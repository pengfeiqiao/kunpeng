[package]
name = "kunpeng-desktop"
version = "2.9.13"
description = "鲲鹏桌面客户端"
authors = ["Kunpeng Contributors"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-execute", "window-all", "macos-private-api", "protocol-asset", "dialog-all", "path-all", "notification-all", "fs-all", "http-all", "shell-open", "devtools", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
chrono = "0.4"
glob = "0.3"
regex = "1"
reqwest = { version = "0.11", features = ["stream", "multipart"] }
prost = "0.12"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
aes = "0.8"
base64 = "0.21"
urlencoding = "2"
futures = "0.3"
zip = "0.6"
libc = "0.2"
rand = "0.8"

# macOS 透明悬浮窗（NSWindow/WKWebView）专用，其他平台不编译
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
