name: 功能建议
description: 为鲲鹏提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！本项目为个人业余项目，Issue 会尽力回应，但无法保证采纳或排期。
  - type: input
    id: version
    attributes:
      label: 当前使用的鲲鹏版本
      placeholder: 2.8.6
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: macOS 15.5 (Apple Silicon)
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景或痛点（是什么让你想要这个功能？）
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 目前你是怎么绕过的？或你见过的其他产品做法
    validations:
      required: false
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 对话 / Agent
        - 画布
        - 工坊
        - 剪辑
        - 文案
        - 设置 / 配置
        - 其他 / 不确定
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有重复建议
          required: true
