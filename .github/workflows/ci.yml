name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 dsh-runtime 依赖
        run: npm ci --prefix dsh-runtime

      - name: 类型检查
        run: npx tsc --noEmit

      - name: Harness 测试
        run: npm run test:harness

      - name: dsh-runtime 测试
        run: npm run test:dsh-runtime

  rust:
    name: Rust 检查（src-tauri）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖（tsconfig/vite 引用）
        run: npm ci

      - name: 构建前端（tauri-build 需要 distDir 存在）
        run: npm run build

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
