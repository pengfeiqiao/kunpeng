      notes: "根据目的地自动应用在地特色服装（3:7原则）"

# 九宫格分镜模式配置
storyboard_modes:
  portrait_focused:
    name: "人像为主模式"
    name_en: "Portrait Focused"
    description: "1近景+1中景+其他远景，人物故事感强，《去有风的地方》风格"
    reference: "《去有风的地方》"

    # 9镜头设计
    shot_design:
